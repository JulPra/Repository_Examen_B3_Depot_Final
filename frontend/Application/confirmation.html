
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - Grand Cinéma</title>
    <link rel="stylesheet" href="styles/style-paiement.css">
</head>
<body>

    <header>
        <h1>Grand Cinéma</h1>
        <a href="films.html">Accueil</a>
    </header>

    <main class="paiement-container">

        <h2>Confirmation de réservation</h2>

        <p id="message-confirmation">
            Vérification de votre paiement en cours...
        </p>

        <section id="details-reservation" hidden>
            <h3 id="film"></h3>

            <p id="nombre-places"></p>
            <p id="montant"></p>
            <p id="statut"></p>

            <h3>Votre QR Code</h3>

            <img id="qrcode" alt="QR Code de votre réservation">

            <p>Présentez ce QR Code à la borne lors de votre arrivée.</p>
        </section>

        <a class="bouton" href="reservations.html">
            Consulter mes réservations
        </a>

    </main>

    <script src="scripts/script-confirmation.js"></script>

</body>
</html>
